services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=controller
      - POSTGRES_USER=controller
      - POSTGRES_DB=controller
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:?DB_PORT not set -- run this from a shell where mise has loaded .envrc (cd into the repo after 'mise trust'), or use 'mise exec -- docker compose ...'}:5432"
  redis:
    image: redis:alpine
    command: redis-server --save '' --appendonly no
    volumes:
      - redis:/data
    ports:
      - "${REDIS_PORT:?REDIS_PORT not set -- run this from a shell where mise has loaded .envrc (cd into the repo after 'mise trust'), or use 'mise exec -- docker compose ...'}:6379"
  powerdns:
    # PowerDNS version is pinned in lib/dev/powerdns/Dockerfile (currently 5.0.7,
    # matching production). Keep the two in step.
    build: ./lib/dev/powerdns
    command: --daemon=no --guardian=no --loglevel=9
    init: true
    ports:
      - "${PDNS_DNS_PORT:?PDNS_DNS_PORT not set -- run this from a shell where mise has loaded .envrc (cd into the repo after 'mise trust'), or use 'mise exec -- docker compose ...'}:53/udp"
      - "${PDNS_API_PORT:?PDNS_API_PORT not set -- run this from a shell where mise has loaded .envrc (cd into the repo after 'mise trust'), or use 'mise exec -- docker compose ...'}:8081/tcp"
  acme_test: # Only used for automated testing
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /test/config/pebble-config.json -strict
    environment:
      - GODEBUG="tls13=1"
      - PEBBLE_VA_ALWAYS_VALID=1
      - PEBBLE_VA_NOSLEEP=1
    ports:
      - "${ACME_API_PORT:?ACME_API_PORT not set -- run this from a shell where mise has loaded .envrc (cd into the repo after 'mise trust'), or use 'mise exec -- docker compose ...'}:14000"
  guacd:
    image: guacamole/guacd:latest
  guac:
    image: guacamole/guacamole:latest
    group_add:
      - "1000"
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      JSON_SECRET_KEY: "${GUAC_KEY}"
    ports:
      - "${GUAC_PORT:?GUAC_PORT not set -- run this from a shell where mise has loaded .envrc (cd into the repo after 'mise trust'), or use 'mise exec -- docker compose ...'}:8080/tcp"

volumes:
  postgres:
  redis:

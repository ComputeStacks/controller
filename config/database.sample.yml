##
# Sample ComputeStacks database config.
# For production this file is omitted; the database is configured entirely from
# environment variables.
#
# For local development, copy it verbatim — the connection details come from
# DEV_DB_URL / TEST_DB_URL in your .envrc:
#
#   cp config/database.sample.yml config/database.yml
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 25) %>

development:
  <<: *default
  url: <%= ENV["DEV_DB_URL"] %>

test:
  <<: *default
  url: <%= ENV["TEST_DB_URL"] %>
